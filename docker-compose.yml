version: '3.8'

services:
  ares:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ares-cyber-platform
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3:latest
      - DATABASE_URL=sqlite:///./data/ares.db
    volumes:
      - ares-data:/app/data
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ares-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  ares-data:
  ollama-models:
